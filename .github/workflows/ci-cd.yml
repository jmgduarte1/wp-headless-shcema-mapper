name: CI/CD WordPress plugin

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  quality:
    name: Tests and quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, intl
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests and quality checks
        run: composer quality

  deploy-staging:
    name: Deploy to staging via FTP
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare plugin package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/headless-angular-schema
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='deploy/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='fixtures/' \
            --exclude='.phpunit.cache/' \
            --exclude='phpunit.xml.dist' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpstan-bootstrap.php' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            ./ deploy/headless-angular-schema/

      - name: Deploy plugin to staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ vars.STAGING_FTP_PORT || '21' }}
          local-dir: ./deploy/
          server-dir: ${{ vars.STAGING_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          log-level: standard
